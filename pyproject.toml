[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jm-connect"
version = "0.1.0"
description = "Lets Junior Marima systems call each other with API keys and hand staff over with one-time sign-in links."
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-api-key>=3.1,<4",
    "python-decouple>=3.8",
    "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
include = ["jm_connect*"]
